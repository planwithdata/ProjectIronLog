<!DOCTYPE html>
<!--
  tools/perf.html — Payload and boot measurements.

  Checks the claims the architecture is built on, rather than assuming them:

    - the vendored libraries are NOT fetched on routes that draw no chart
      and generate no PDF
    - Chart.js loads on Progress, and only then
    - the app-shell payload stays small
    - first paint and boot happen in a sensible time

    chrome --headless=new --virtual-time-budget=40000 \
           --dump-dom http://127.0.0.1:PORT/tools/perf.html
-->
<html>
<head><meta charset="utf-8"><title>perf</title></head>
<body style="margin:0;font:12px/1.6 monospace;background:#fff;color:#111">
<pre id="out">measuring…</pre>
<iframe id="frame" src="../index.html#/home" style="width:402px;height:900px;border:1px solid #ccc"></iframe>

<script type="module">
  const lines = [];
  let failures = 0;

  const report = () => { document.getElementById('out').textContent = lines.join('\n'); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const kb = (bytes) => `${(bytes / 1024).toFixed(1)} KB`;

  const check = (label, pass, detail = '') => {
    if (!pass) failures += 1;
    lines.push(`  ${pass ? 'ok  ' : 'FAIL'} ${label}${detail ? ` — ${detail}` : ''}`);
  };

  const frame = document.getElementById('frame');

  function resources(win) {
    return win.performance.getEntriesByType('resource');
  }

  const loaded = (win, needle) =>
    resources(win).some((entry) => entry.name.includes(needle));

  async function run() {
    await wait(2500);

    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    if (!doc?.documentElement.dataset.booted) {
      lines.push('ERROR: app did not boot');
      report();
      return;
    }

    /* --- Shell payload -------------------------------------------------- */
    lines.push('SHELL PAYLOAD (route #/home)');

    const shell = resources(win).filter((entry) =>
      /\.(js|css|json|png|svg)$/.test(new URL(entry.name).pathname));

    const total = shell.reduce((sum, entry) => sum + (entry.transferSize || entry.encodedBodySize || 0), 0);
    const byType = {};
    for (const entry of shell) {
      const ext = new URL(entry.name).pathname.split('.').pop();
      byType[ext] = (byType[ext] ?? 0) + (entry.transferSize || entry.encodedBodySize || 0);
    }

    lines.push(`  ${shell.length} requests, ${kb(total)} total`);
    for (const [ext, bytes] of Object.entries(byType).sort((a, b) => b[1] - a[1])) {
      lines.push(`    .${ext.padEnd(5)} ${kb(bytes)}`);
    }
    // No bundler, so the module count is higher than a built app; the service
    // worker removes the cost after the first visit. This is the ceiling.
    check('shell under 250 KB', total < 250 * 1024, kb(total));

    /* --- Lazy libraries ------------------------------------------------- */
    lines.push('', 'LAZY LIBRARIES');
    check('Chart.js not loaded on Home', !loaded(win, 'chart.umd.js'));
    check('jsPDF not loaded on Home', !loaded(win, 'jspdf'));

    win.location.hash = '#/workout';
    await wait(700);
    check('Chart.js not loaded on Workout', !loaded(win, 'chart.umd.js'));

    win.location.hash = '#/settings';
    await wait(700);
    check('Chart.js not loaded on Settings', !loaded(win, 'chart.umd.js'));

    win.location.hash = '#/progress';
    await wait(2200);
    check('Chart.js loads on Progress', loaded(win, 'chart.umd.js'));
    check('jsPDF still not loaded', !loaded(win, 'jspdf'),
      'only the PDF export should pull it in');

    const chart = resources(win).find((entry) => entry.name.includes('chart.umd.js'));
    if (chart) {
      lines.push(`    Chart.js ${kb(chart.transferSize || chart.encodedBodySize)}`);
    }

    /* --- Timings -------------------------------------------------------- */
    lines.push('', 'TIMINGS (uncached, local server)');
    const nav = win.performance.getEntriesByType('navigation')[0];
    const paint = win.performance.getEntriesByName('first-contentful-paint')[0];

    if (nav) {
      lines.push(`  DOM interactive   ${nav.domInteractive.toFixed(0)} ms`);
      lines.push(`  DOM content ready ${nav.domContentLoadedEventEnd.toFixed(0)} ms`);
    }
    if (paint) {
      lines.push(`  First paint       ${paint.startTime.toFixed(0)} ms`);
      check('first paint under 1000 ms', paint.startTime < 1000, `${paint.startTime.toFixed(0)} ms`);
    }

    /* --- Route render cost ---------------------------------------------- */
    lines.push('', 'ROUTE RENDER (ms, measured in-page)');
    for (const route of ['home', 'workout', 'history', 'reports', 'settings']) {
      const start = win.performance.now();
      win.location.hash = `#/${route}`;
      await wait(450);
      const elapsed = win.performance.now() - start - 450;
      lines.push(`  #/${route.padEnd(9)} ${Math.max(0, elapsed).toFixed(0)} ms`);
    }

    lines.unshift(failures === 0 ? 'PERF OK' : `PERF ${failures} check(s) failed`, '');
    report();
    document.title = failures === 0 ? 'OK' : 'FAIL';
  }

  run().catch((error) => {
    lines.push(`THREW: ${error?.stack || error}`);
    report();
  });
</script>
</body>
</html>
