<!DOCTYPE html>
<!--
  tools/preview.html — Visual review harness.

  Headless Chrome ignores --window-size when laying out a screenshotted page,
  which makes it useless for checking a mobile-first design. Rendering the app
  inside fixed-size iframes forces a genuine device-width layout, so a single
  screenshot of this page shows all three target sizes accurately.

  Open it in a normal browser too — it is the fastest way to eyeball phone,
  tablet and desktop side by side.

    http://127.0.0.1:PORT/tools/preview.html
    http://127.0.0.1:PORT/tools/preview.html?route=workout
-->
<html>
<head>
  <meta charset="utf-8">
  <title>IronLog · preview</title>
  <style>
    body {
      margin: 0; padding: 20px; background: #3a3a3c;
      font: 600 12px -apple-system, "Segoe UI", system-ui, sans-serif;
      color: #fff; display: flex; gap: 20px; align-items: flex-start;
    }
    figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
    figcaption { letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
    iframe { border: 0; border-radius: 14px; background: #000; display: block; }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const route = params.get('route') || 'home';

    // ?theme=light seeds the stored setting before the frames load, so the
    // light palette can be reviewed without clicking through Settings.
    // Same origin as the app, so this is the same key the app reads.
    const theme = params.get('theme');
    if (theme) {
      const key = 'ironlog:v1:settings';
      const current = JSON.parse(localStorage.getItem(key) || '{}');
      localStorage.setItem(key, JSON.stringify({ ...current, theme }));
    }

    // iPhone 15/16 logical width, iPad portrait, and a desktop column.
    const SIZES = [
      { label: 'iPhone · 402',  width: 402,  height: 1180 },
      { label: 'iPad · 834',    width: 834,  height: 1180 },
      { label: 'Desktop · 1280', width: 1280, height: 1180 },
    ];

    function mountFrames() {
      for (const size of SIZES) {
        const figure = document.createElement('figure');

        const caption = document.createElement('figcaption');
        caption.textContent = size.label;

        const frame = document.createElement('iframe');
        frame.src = `../index.html#/${route}`;
        frame.width = size.width;
        frame.height = size.height;
        frame.setAttribute('title', size.label);

        figure.append(caption, frame);
        document.body.appendChild(figure);
      }
    }

    /*
     * ?seed=logging fabricates a plausible training history and leaves a
     * workout open, so the logging UI, rest timer and history views can be
     * reviewed without lifting anything. Writes to this origin's Local
     * Storage — run it against a throwaway browser profile, never one holding
     * real training data.
     */
    async function seed(kind) {
      const [db, programService, sessionService, bodyService, notesService] = await Promise.all([
        import('../js/services/db.js'),
        import('../js/services/program-service.js'),
        import('../js/services/session-service.js'),
        import('../js/services/body-service.js'),
        import('../js/services/notes-service.js'),
      ]);

      localStorage.clear();
      await db.init();
      await programService.load();

      const iso = (d) => d.toISOString().slice(0, 10);
      const daysAgo = (n) => {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return iso(d);
      };

      // Three past Tuesdays of chest work, progressing.
      const script = [
        { day: 'tuesday-chest', when: 21, weight: 25,   reps: [8, 7, 7, 6] },
        { day: 'tuesday-chest', when: 14, weight: 27.5, reps: [8, 8, 7, 6] },
        { day: 'tuesday-chest', when: 7,  weight: 27.5, reps: [8, 8, 8, 8] },
      ];

      for (const step of script) {
        const session = await sessionService.startSession(step.day, daysAgo(step.when));
        for (const entry of session.entries) {
          const exercise = programService.getExercise(entry.exerciseId);
          for (let i = 0; i < entry.sets.length; i += 1) {
            const isIncline = entry.exerciseId === 'incline-dumbbell-press';
            await sessionService.updateSet(session.id, entry.exerciseId, i, {
              weightKg: isIncline ? step.weight : (entry.sets[i].weightKg ?? 20),
              reps: isIncline ? step.reps[i] : (exercise.reps.min + 1),
              completed: true,
            });
          }
        }
        await sessionService.completeSession(session.id);
      }

      // Body data, so Home is not all em dashes.
      for (let i = 20; i >= 0; i -= 2) {
        await bodyService.logWeight(76 + (20 - i) * 0.05, daysAgo(i));
      }
      await bodyService.logComposition(
        { weightKg: 77, bodyFatPercent: 14.6, muscleMassKg: 62.1, bmr: 1780 },
        daysAgo(2)
      );

      await notesService.addNote({
        text: 'Replace High-to-Low Fly with Low-to-High Fly',
        category: 'exercise', source: 'ChatGPT', pinned: true,
      });
      await notesService.addNote({ text: 'Bulk until 79 kg', category: 'nutrition' });

      if (kind === 'logging') {
        // Leave today's session open, with the first two sets already ticked.
        const today = programService.getTodayDay();
        if (today && today.type === 'training') {
          const open = await sessionService.startSession(today.id);
          const first = open.entries[0];
          for (let i = 0; i < Math.min(2, first.sets.length); i += 1) {
            await sessionService.updateSet(open.id, first.exerciseId, i, {
              weightKg: first.sets[i].weightKg ?? 30,
              reps: first.targetReps?.[i] ?? 8,
              completed: true,
            });
          }
        }
      }
    }

    const seedKind = params.get('seed');
    if (seedKind) seed(seedKind).then(mountFrames).catch((error) => {
      document.body.innerHTML = `<pre style="color:#fff">seed failed: ${error.stack || error}</pre>`;
    });
    else mountFrames();
  </script>
</body>
</html>
